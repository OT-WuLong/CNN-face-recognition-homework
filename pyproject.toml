[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cnn-face-course"
version = "0.1.0"
description = "Course project: build and train a CNN for face recognition."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cnn-face = "cnn_face.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
